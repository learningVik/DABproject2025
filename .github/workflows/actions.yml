name: Databricks Repo Sync

on:
  push:
    branches:
      - dev
      - main

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

# runs-on: ubuntu-latest

jobs:
  # --- Job 1: Pre-commit checks (optional) ---
  pre_commit_checks:
    # Use the globally defined runs-on and environment keys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 is important to run hooks on all files/commits
          fetch-depth: 0
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  # --- Job 2: Sync Databricks Repo via Bundle Deploy ---
  sync_databricks_repo:
    # Ensure this job runs after the checks job, if the previous job is critical
    # needs: pre_commit_checks
    # Use the globally defined runs-on and environment keys
    needs: pre_commit_checks # This makes Job 2 wait for Job 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Databricks CLI
        # It's highly recommended to use a specific, stable version tag (e.g., @v0.211.0)
        uses: databricks/setup-cli@v0.211.0

      - name: Deploy Databricks Asset Bundle
        # Use an 'if' condition to select the target based on the branch name.
        # This assumes you have 'dev' and 'prod' targets defined in your databricks-bundle.yml
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            databricks bundle deploy -t main
          else
            databricks bundle deploy -t dev
          fi
